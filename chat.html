<body style="overflow: hidden;">
  <!-- NAVBAR -->

    <div class="container">
      <a href="/" class="nav-brand">
        <img src="/assets/logo.jpg" alt="ücretsiz.ai" width="32" height="32" class="nav-logo">
        <span class="nav-brand-text">ücretsiz<span class="text-primary">.ai</span></span>
      </a>
      <nav class="nav-links" id="nav-links" role="navigation">
        <a href="/" data-i18n="nav.home">Ana Sayfa</a>
        <a href="/models.html" data-i18n="nav.models">AI Modeller</a>
        <a href="/chat.html" class="active" data-i18n="nav.chat">Sohbet</a>
        <a href="/karsilastir.html" data-i18n="nav.compare">Karşılaştır</a>
        <a href="/hakkimizda.html" data-i18n="nav.about">Hakkımızda</a>
      </nav>
      <div class="nav-actions">
        <button id="lang-toggle" class="btn btn-ghost btn-sm">EN</button>
        <button id="theme-toggle" class="btn btn-ghost btn-icon" aria-label="Tema"></button>
        <button id="settings-btn" class="btn btn-ghost btn-icon" aria-label="Ayarlar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>

  </header>

  <main class="chat-page-layout container" >
<div id="chat-container" class="chat-container">
          <!-- Chat Sidebar -->
          <aside class="chat-sidebar">
            <div class="chat-sidebar-header">
              <button id="chat-new-btn" class="btn btn-primary btn-sm" style="width: 100%;" data-i18n="chat.new">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                Yeni Sohbet
                </button>
                <button id="chat-sidebar-close" class="btn btn-ghost btn-icon" style="width: 32px; height: 32px; flex-shrink: 0;" aria-label="Kapat">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
              </div>
            <div id="chat-history-list" class="chat-history-list">
              <!-- Sohbet geçmişi JS ile doldurulur -->
            </div>
          </aside>

          <!-- Chat Main Area -->
          <div class="chat-main">
            <!-- Chat Header -->
            <div class="chat-header">
              <button id="history-toggle-btn" class="btn btn-ghost btn-icon" style="margin-right: auto;" title="Geçmiş"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg></button>
              <div class="chat-sidebar-overlay" id="chat-overlay"></div>
              <button id="chat-sidebar-toggle" class="btn btn-ghost btn-icon hide-desktop" aria-label="Sohbet geçmişi">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
              </button>
              <div class="chat-model-selector">
                <label for="chat-model-select" class="sr-only" data-i18n="chat.model.select">Model Seçin</label>
                <select id="chat-model-select" class="select">
                  <!-- JS ile doldurulur -->
                </select>
              </div>
            </div>

            <!-- Chat Messages -->
            <div id="chat-messages" class="chat-messages" role="log" aria-live="polite">
              <!-- JS ile doldurulur -->
            </div>

            <!-- Typing Indicator -->
            <div id="chat-typing" class="chat-typing" style="display: none;">
              <div class="typing-dots">
                <span></span><span></span><span></span>
              </div>
              <span data-i18n="chat.typing">Yanıt yazıyor...</span>
            </div>

            <!-- Chat Input -->
            
            
            <!-- Chat Input Area -->
            <div class="chat-input-area">
              
              <div class="ai-status-indicator" style="display: none;">
                <svg class="ai-spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83"/></svg>
                <span class="ai-status-text">Düşünüyor...</span>
              </div>
              <div class="chat-input">
                <textarea 
                  rows="1" 
                  placeholder="Mesajınızı yazın..." 
                  data-i18n="chat.placeholder" 
                  data-i18n-target="placeholder"
                  aria-label="Mesaj girin"
                ></textarea>
                <button id="chat-send-btn" class="chat-send-btn btn btn-primary btn-icon" aria-label="Gönder">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
                </button>
                <button id="chat-stop-btn" class="chat-send-btn btn btn-danger btn-icon" aria-label="Durdur" style="display: none;">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
                </button>
              </div>
              <p class="chat-disclaimer text-muted text-sm">
                Ücretsiz modeller kullanılmaktadır. Yanıtlar her zaman doğru olmayabilir.
              </p>
            </div>
          </div>
        </div>

  </main>

  <!-- Settings Modal (Shared) -->
  <div id="settings-modal" class="modal" role="dialog" aria-modal="true">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h3 data-i18n="settings.title">Ayarlar</h3>
        <button class="modal-close btn btn-ghost btn-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
      </div>
      <div class="modal-body">
        <div class="settings-group">
          <label for="api-key-input" class="settings-label">OpenRouter API Anahtarı</label>
          <input type="password" id="api-key-input" class="input" placeholder="sk-or-v1-xxxx...">
          <p class="text-sm text-muted" style="margin-top:.5rem;"><a href="https://openrouter.ai/keys" target="_blank" rel="noopener" class="text-primary">openrouter.ai/keys →</a></p>
        </div>
      </div>
      <div class="modal-footer">
        <button class="settings-save btn btn-primary">Kaydet</button>
      </div>
    </div>
  </div>
  
  <div id="toast-container" aria-live="polite"></div>

  <script src="/js/theme.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/chat.js"></script>
</body>
</html>
